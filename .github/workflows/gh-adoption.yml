name: fx103-governed-adoption
on:
  push:
    branches: [main]
    paths: ['fx103-fixtures/**']
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
      environment:
        type: string
        required: false
run-name: ${{ inputs.helio_execution_id || github.run_id }}
permissions:
  contents: read
  deployments: write
jobs:
  qa:
    runs-on: ubuntu-latest
    environment: fx103-adoption-qa
    steps:
      - run: echo "fx103 synthetic preproduction fixture"
  production:
    needs: qa
    runs-on: ubuntu-latest
    environment: fx103-adoption-prod
    steps:
      - run: echo "fx103 synthetic production fixture; no deployment"
