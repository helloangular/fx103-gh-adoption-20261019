name: fx104-reusable
run-name: ${{ inputs.helio_execution_id || github.run_id }}
on:
  push:
    branches: [main]
    paths: ['fx104-gh48-reusable/**']
  workflow_dispatch:
    inputs:
      helio_execution_id: {type: string, required: false, default: ''}
      environment: {type: string, required: false, default: fx104-gh48-test}
permissions:
  contents: read
jobs:
  fx104-bootstrap:
    runs-on: ubuntu-latest
    environment: fx104-gh48-test
    steps:
      - run: echo "Owned canonical bootstrap before unsupported reusable update"
