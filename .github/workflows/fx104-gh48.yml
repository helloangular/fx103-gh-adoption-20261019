name: fx104-gh48
run-name: ${{ inputs.helio_execution_id || github.run_id }}
on:
  push:
    branches: [main, fx104-gh48-feature]
    paths: ['fx104-gh48/**']
  pull_request:
    branches: [main]
    paths: ['fx104-gh48/**']
  workflow_dispatch:
    inputs:
      environment: {type: string, default: fx104-gh48-test, required: false}
      helio_execution_id: {type: string, required: false, default: ''}
permissions:
  contents: read
jobs:
  fx104-probe:
    runs-on: ubuntu-latest
    environment: fx104-gh48-test
    steps:
      - run: echo "Owned pre-watermark fixture; no deployment"
      - name: Owned non-secret Helio variable witness
        env:
          FX104_REGION_WITNESS: ${{ vars.REGION }}
          FX104_CATALOG_WITNESS: ${{ vars.HELIO_ENVIRONMENTS }}
        run: |
          printf 'REGION=%s\n' "$FX104_REGION_WITNESS"
          printf 'HELIO_ENVIRONMENTS=%s\n' "$FX104_CATALOG_WITNESS"
